---
- name: Deploy SprintForge on a Debian or Ubuntu server
  hosts: all
  become: true
  vars:
    sprintforge_domain: sprintforge.netwizzard.tech
    sprintforge_repo: https://github.com/olamidebello/SprintForge.git
    sprintforge_ref: main
    sprintforge_port: 18870
    sprintforge_email: ""
    sprintforge_tls: true
  tasks:
    - name: Validate deployment settings
      ansible.builtin.assert:
        that:
          - sprintforge_domain is match('^[a-z0-9.-]+$')
          - not sprintforge_tls or sprintforge_email | length > 3
        fail_msg: Set sprintforge_email for certificate notifications, or explicitly set sprintforge_tls=false for HTTP-only staging.
    - name: Install system packages
      ansible.builtin.apt:
        name: [git, python3, nginx, certbot, python3-certbot-nginx]
        state: present
        update_cache: true
    - name: Create service user
      ansible.builtin.user:
        name: sprintforge
        system: true
        create_home: false
        shell: /usr/sbin/nologin
    - name: Create application directory
      ansible.builtin.file:
        path: /opt/sprintforge
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Detect existing application database
      ansible.builtin.stat:
        path: /var/lib/sprintforge/sprintforge.db
      register: sf_existing_database
    - name: Create protected backup directory
      ansible.builtin.file:
        path: /var/backups/sprintforge
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: sf_existing_database.stat.exists
    - name: Back up existing database before updating source
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import os,sqlite3,sys; os.umask(0o077); src=sqlite3.connect('file:/var/lib/sprintforge/sprintforge.db?mode=ro',uri=True); dest=sqlite3.connect(sys.argv[1]); src.backup(dest); dest.close(); src.close()"
          - '/var/backups/sprintforge/pre-deploy-{{ ansible_date_time.iso8601_basic_short }}-{{ ansible_date_time.epoch }}.db'
      when: sf_existing_database.stat.exists
      changed_when: true
    - name: Pull application source
      ansible.builtin.git:
        repo: '{{ sprintforge_repo }}'
        dest: /opt/sprintforge
        version: '{{ sprintforge_ref }}'
        force: false
      notify: Restart SprintForge
    - name: Create private persistent data directory
      ansible.builtin.file:
        path: /var/lib/sprintforge
        state: directory
        owner: sprintforge
        group: sprintforge
        mode: '0700'
    - name: Install service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/sprintforge.service
        mode: '0644'
        content: |
          [Unit]
          Description=SprintForge SDLC workspace
          After=network.target
          [Service]
          User=sprintforge
          Group=sprintforge
          WorkingDirectory=/opt/sprintforge
          Environment=SPRINTFORGE_DB=/var/lib/sprintforge/sprintforge.db
          Environment=SPRINTFORGE_SECURE_COOKIE={{ '1' if sprintforge_tls else '0' }}
          Environment=HOST=127.0.0.1
          Environment=PORT={{ sprintforge_port }}
          ExecStart=/usr/bin/python3 /opt/sprintforge/app.py
          Restart=on-failure
          RestartSec=3
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/var/lib/sprintforge
          [Install]
          WantedBy=multi-user.target
      notify: Restart SprintForge
    - name: Enable and start service
      ansible.builtin.systemd:
        name: sprintforge
        enabled: true
        state: started
        daemon_reload: true
    - name: Verify application health before changing routing
      ansible.builtin.meta: flush_handlers
    - name: Confirm application backend
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ sprintforge_port }}/api/health
        status_code: 200
      register: sf_health
      retries: 5
      delay: 2
      until: sf_health.status == 200
    - name: Select loopback and primary IPv4 listeners
      ansible.builtin.set_fact:
        sprintforge_bind_ipv4: "{{ (['127.0.0.1'] + [ansible_default_ipv4.address | default('127.0.0.1')]) | unique | list }}"
    - name: Detect existing certificate
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ sprintforge_domain }}/fullchain.pem
      register: sf_certificate
    - name: Inspect previous SprintForge routing
      ansible.builtin.stat:
        path: /etc/nginx/sites-available/sprintforge
      register: sf_previous_route
    - name: Save previous application route for rollback
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/sprintforge
      register: sf_old_route
      when: sf_previous_route.stat.exists
    - name: Inspect previous enabled route
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/sprintforge
        follow: false
      register: sf_previous_enabled
    - name: Install and verify dedicated SprintForge routing
      block:
        - name: Render exact-name route on loopback and primary server IP
          ansible.builtin.template:
            src: templates/sprintforge.conf.j2
            dest: /etc/nginx/sites-available/sprintforge
            mode: '0644'
            backup: true
        - name: Enable dedicated route
          ansible.builtin.file:
            src: /etc/nginx/sites-available/sprintforge
            dest: /etc/nginx/sites-enabled/sprintforge
            state: link
        - name: Validate Nginx and reject duplicate SprintForge names
          ansible.builtin.command: nginx -T
          register: sf_nginx_configuration
          changed_when: false
          failed_when: >-
            sf_nginx_configuration.rc != 0 or
            ('conflicting server name "' ~ sprintforge_domain ~ '"') in sf_nginx_configuration.stderr or
            '# configuration file /etc/nginx/sites-enabled/sprintforge:' not in sf_nginx_configuration.stdout
          no_log: true
        - name: Activate validated route
          ansible.builtin.systemd:
            name: nginx
            state: reloaded
        - name: Verify SprintForge identity on each local listener
          ansible.builtin.uri:
            url: 'http://{{ item }}/'
            headers:
              Host: '{{ sprintforge_domain }}'
            follow_redirects: none
            status_code: [200, 301, 302, 308]
            return_content: true
          loop: '{{ sprintforge_bind_ipv4 }}'
          register: sf_route_probe
          failed_when: >-
            (sf_route_probe.status == 200 and '<title>SprintForge' not in sf_route_probe.content) or
            (sf_route_probe.status != 200 and not (sf_route_probe.location | default('')).startswith('https://' ~ sprintforge_domain ~ '/'))
      rescue:
        - name: Retain private routing diagnostics
          ansible.builtin.copy:
            dest: /var/log/sprintforge-nginx-diagnostic.log
            content: '{{ sf_nginx_configuration.stdout | default("") }}
{{ sf_nginx_configuration.stderr | default("") }}'
            mode: '0600'
        - name: Restore previous SprintForge route
          ansible.builtin.copy:
            dest: /etc/nginx/sites-available/sprintforge
            content: '{{ sf_old_route.content | b64decode }}'
            mode: '0644'
          when: sf_previous_route.stat.exists
        - name: Remove newly created failed route link
          ansible.builtin.file:
            path: /etc/nginx/sites-enabled/sprintforge
            state: absent
          when: not sf_previous_enabled.stat.exists
        - name: Remove newly created failed route file
          ansible.builtin.file:
            path: /etc/nginx/sites-available/sprintforge
            state: absent
          when: not sf_previous_route.stat.exists
        - name: Validate restored Nginx configuration
          ansible.builtin.command: nginx -t
          changed_when: false
        - name: Activate restored routing
          ansible.builtin.systemd:
            name: nginx
            state: reloaded
        - name: Stop after restoring the previous application routing
          ansible.builtin.fail:
            msg: 'SprintForge routing failed and its prior route was restored. Inspect /var/log/sprintforge-nginx-diagnostic.log privately for duplicate names or a missing sites-enabled include. Other site files were not changed.'
    - name: Verify public HTTP routing before requesting a certificate
      ansible.builtin.uri:
        url: http://{{ sprintforge_domain }}/
        follow_redirects: none
        status_code: 200
        return_content: true
      register: sf_public_http
      failed_when: "'<title>SprintForge' not in sf_public_http.content"
      when: sprintforge_tls | bool and not sf_certificate.stat.exists
    - name: Provision TLS certificate and redirect HTTP
      ansible.builtin.command:
        argv:
          - certbot
          - --nginx
          - --non-interactive
          - --agree-tos
          - --redirect
          - --email
          - '{{ sprintforge_email }}'
          - -d
          - '{{ sprintforge_domain }}'
        creates: /etc/letsencrypt/live/{{ sprintforge_domain }}/fullchain.pem
      when: sprintforge_tls
    - name: Verify SprintForge identity over public HTTPS
      ansible.builtin.uri:
        url: https://{{ sprintforge_domain }}/
        status_code: 200
        return_content: true
        validate_certs: true
      register: sf_public_identity
      failed_when: "'<title>SprintForge' not in sf_public_identity.content"
      when: sprintforge_tls | bool
    - name: Verify public TLS routing from the server
      ansible.builtin.uri:
        url: https://{{ sprintforge_domain }}/api/health
        status_code: 200
      when: sprintforge_tls
  handlers:
    - name: Restart SprintForge
      ansible.builtin.systemd:
        name: sprintforge
        state: restarted
        daemon_reload: true
    - name: Reload Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
